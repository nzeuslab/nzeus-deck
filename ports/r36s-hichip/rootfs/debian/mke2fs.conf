# mke2fs settings for nzroot (make-image.sh sets MKE2FS_CONFIG to this file),
# so the result is the same whatever e2fsprogs version or distribution the PC has.
# Features = Ubuntu 24.04 / Debian 12 ext4 defaults, written out:
# metadata_csum WITHOUT metadata_csum_seed and WITHOUT orphan_file (newer
# upstream defaults that older tools and boot loaders do not all understand;
# nz_region.py changes the UUID with tune2fs -U, which works either way).
# Kernel 7.2 and e2fsprogs >= 1.43 know every feature listed here.
[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384

[fs_types]
	ext4 = {
		features = has_journal,extent,huge_file,flex_bg,metadata_csum,64bit,dir_nlink,extra_isize
	}
