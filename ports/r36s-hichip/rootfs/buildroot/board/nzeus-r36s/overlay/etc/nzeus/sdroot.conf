# NZEUS SD root: where things are. Must match ports/r36s-hichip/rootfs/PLAN.md and
# the blkdevparts= line of the kernel that boots this root:
#   p1 nzstock (stock FAT32, read-only)  p2 nzhdr (read-only)  p3 nzroot (this)
#   p4 nzdata (/data)                    p5 nzhdr2 (read-only)
# Read by /usr/local/sbin/nzeus-rootcheck, nzeus-datamount and nzeus-status.
NZ_ROOT_DEV=/dev/mmcblk0p3
NZ_ROOT_LABEL=nzroot
NZ_DATA_DEV=/dev/mmcblk0p4
NZ_DATA_LABEL=nzdata
NZ_DATA_DIR=/data
NZ_STOCK_DEV=/dev/mmcblk0p1
NZ_STOCK_DIR=/mnt/stock
# Partitions this system must never write (stock FAT32 and the two header blocks).
# If the kernel does not report all of them read-only, the root stays read-only.
NZ_NEVER_WRITE="/dev/mmcblk0p1 /dev/mmcblk0p2 /dev/mmcblk0p5"
