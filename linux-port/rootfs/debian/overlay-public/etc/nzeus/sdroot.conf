# NZEUS Deck, copy-and-go install (public image): where things are.
# nz-fatroot (boot RAM disk) attaches, in this order on every start:
#   loop0 = the card's FAT32 (/sdcard), loop1 = nzeus/nzroot.img (/), loop2 = nzeus/nzdata.img (/data)
# Read by /usr/local/sbin/nzeus-rootcheck, nzeus-datamount and nzeus-status.
NZ_ROOT_DEV=/dev/loop1
NZ_ROOT_LABEL=nzroot
NZ_DATA_DEV=/dev/loop2
NZ_DATA_LABEL=nzdata
NZ_DATA_DIR=/data
NZ_STOCK_DEV=
NZ_STOCK_DIR=/sdcard
# Nothing is "never write" here: writing the FAT32 (/sdcard) is the point of this install.
NZ_NEVER_WRITE=""
