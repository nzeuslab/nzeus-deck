# e2fsck settings for the NZEUS console.
# The console has no clock chip: every start begins in 1970 until clock.txt or
# the network sets the time. Without this, e2fsck could treat "last mounted in
# the future" as a problem to fix on the mounted root (which would keep the
# root read-only until a restart, every time).
[options]
	broken_system_clock = 1
